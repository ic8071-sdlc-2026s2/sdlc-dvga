# Linea base del gate de la fase 5 (Trivy). Cada excepcion lleva statement con su
# justificacion y expired_at para que caduque y se vuelva a revisar.
#
# Contexto medido en esta Mac el 2026-10-28 con aquasec/trivy:0.76.1:
#   - Imagen con la base python:3.10 completa: 551 HIGH/CRITICAL del sistema operativo
#     (534 HIGH, 17 CRITICAL) + ~32 de dependencias de Python.
#   - Imagen con la base python:3.10-slim (correccion del hallazgo #21): 53 HIGH del SO,
#     TODAS sin parche publicado, mas 28 de dependencias de Python con parche.
# Por eso el gate usa ignore-unfixed: true (los 53 del SO no tienen version que instalar;
# se justifica en la presentacion) y esta linea base cubre las 28 de dependencias, que no
# se pueden subir sin romper la paridad con DVGA 2.2.0 (graphene 2.x / flask-graphql).
# Las dependencias se corrigen de verdad cuando el proyecto migre a graphene 3; mientras
# tanto se aceptan con justificacion. Ver hallazgos #18 y #20.
vulnerabilities:
  - id: CVE-2023-37920
    statement: "certifi 2022.12.7 (HIGH): Transitiva pinneada por el stack de DVGA 2.2.0; subirla no es trivial sin romper requests/urllib3 (hallazgo #20)."
    expired_at: 2027-06-30
  - id: GHSA-6q48-6c7w-9gw2
    statement: "certifi 2022.12.7 (CRITICAL): Transitiva pinneada por el stack de DVGA 2.2.0; subirla no es trivial sin romper requests/urllib3 (hallazgo #20)."
