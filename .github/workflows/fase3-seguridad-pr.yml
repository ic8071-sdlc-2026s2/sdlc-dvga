# Fase 3: seguridad en cada pull request. En esta fase el pipeline solo reporta:
# ningun hallazgo detiene el PR. Excepcion: si la prueba de la regla propia de
# Semgrep falla, el job falla.
name: Fase 3 · Seguridad en PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  sast:
    name: SAST con Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep CE
        run: pip install semgrep==1.182.0

      - name: Probar las reglas propias
        run: semgrep --test seguridad/fase-3/semgrep

      - name: Escanear app/ con p/default y las reglas propias
        run: |
          mkdir -p reportes
          semgrep scan app --config p/default --config seguridad/fase-3/semgrep \
            --metrics off --sarif --output reportes/semgrep.sarif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reporte-semgrep
          path: reportes/

  secretos:
    name: Secretos con Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Buscar secretos en todo el historial
        run: |
          mkdir -p reportes
          # Gitleaks corre como contenedor: la action oficial pide licencia para
          # organizaciones. Dentro del contenedor git desconfia de un repositorio
          # de otro dueno, por eso -u con el usuario del runner.
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo \
            --redact --exit-code 0 \
            --report-format sarif --report-path /repo/reportes/gitleaks.sarif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reporte-gitleaks
          path: reportes/

  dependencias:
    name: Dependencias nuevas con Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # En la fase 3 solo reporta (warn-only). En la fase 5 se quita warn-only
      # para que el PR se bloquee si agrega una dependencia con severidad alta.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          warn-only: true
