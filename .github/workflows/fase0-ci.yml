# Fase 0: primer pipeline en verde. Construye la imagen de la app y verifica que responde.
# Endurecido en la fase 3: permisos minimos y actions fijadas por hash de commit.
name: Fase 0 · CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  construir-y-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir la imagen de la app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          tags: lab-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Levantar la app y esperar a que responda
        run: bash lab/app.sh iniciar lab-app:ci

      - name: Prueba de humo
        run: bash lab/app.sh humo

      - name: Bitácora de la app
        if: always()
        run: bash lab/app.sh logs
